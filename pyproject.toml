[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble3d-local"
version = "0.1.0"
description = "Offline Ensemble3D job recovery and immutable asset versioning study"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Derek Poe"}]
dependencies = []

[project.scripts]
ensemble3d = "ensemble3d.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
